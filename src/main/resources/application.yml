spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/project_management
    username: postgres
    password: password
  thymeleaf:
    cache: false  # Disable cache for development

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8080

jwt:
  secret: your_secret_key_here_should_be_at_least_256_bits_long_for_hs512